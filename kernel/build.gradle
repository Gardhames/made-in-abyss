plugins { id 'java-library' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }
dependencies {
    implementation 'it.unimi.dsi:fastutil:8.5.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'mia.storageRoot', rootProject.miaStorageRoot
    testLogging { events 'passed', 'failed', 'skipped' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }

// Two JavaExec tasks intentionally use separate JVMs to test persistence across a process boundary.
sourceSets {
    probe {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
['cubeWriteProbe': 'write', 'cubeReadProbe': 'read'].each { taskName, phase ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn tasks.named('probeClasses')
        classpath = sourceSets.probe.runtimeClasspath
        mainClass = 'dev.madeinabyss.kernel.probe.CubeProcessProbe'
        doFirst {
            def directory = providers.gradleProperty('miaCubeProbeRoot')
            if (!directory.isPresent()) throw new GradleException('Set -PmiaCubeProbeRoot to a fresh isolated directory on I:')
            args phase, directory.get()
        }
    }
}
tasks.named('cubeReadProbe') { mustRunAfter 'cubeWriteProbe' }
